name: mre_quran
description: An Arabic-first Quran application.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.14.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  adhan: ^2.0.0+1
  archive: ^4.3.0
  background_downloader: ^9.6.3
  crypto: ^3.0.7
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  geolocator: ^14.1.1
  geocoding: ^5.0.0
  google_maps_flutter: ^2.18.2
  go_router: ^18.0.2
  hijri: ^3.0.1
  intl: ^0.20.3
  # Direct, synchronous calls into the app's own Kotlin (JNI) and Swift
  # (Objective-C runtime) code, without a platform channel.
  jni: ^1.1.0
  jni_flutter: ^1.0.3
  liquid_glass_widgets: ^1.17.5
  meta: ^1.19.0
  mre_fields: ^0.4.1
  objective_c: ^9.6.2
  path_provider: ^2.1.6
  sensors_plus: ^7.1.1
  shared_preferences: ^2.5.3
  timezone: ^0.11.1
  vibration: ^3.2.1
  wakelock_plus: ^1.5.2
  xml: ^7.0.0
  google_maps_flutter_ios_sdk9: ^2.19.0
  flutter_svg: ^2.4.0
  vector_graphics: ^1.3.1
  vector_graphics_compiler: ^1.3.6
  share_plus: ^13.3.1
  pdf: ^3.13.1
  printing: ^5.15.1
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  url_launcher: ^6.3.3
  quick_actions: ^1.1.1
dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  go_router_builder: ^4.5.0
  shared_preferences_platform_interface: ^2.4.2
  wakelock_plus_platform_interface: ^1.7.0
  google_maps_flutter_platform_interface: ^2.18.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/quran/quran-data.xml
    - assets/quran/quran-uthmani.txt
    - assets/quran/quran-simple-clean.txt
    - assets/quran/kfgqpc/tafseerMouaser_v03.txt
    - assets/quran/kfgqpc/read.me
    - assets/quran/svg/hafs_kfqc_manifest.json
    - assets/quran/svg/shubah_kfqc_manifest.json
    - assets/quran/svg/warsh_kfqc_manifest.json
    - assets/quran/svg/qalon_kfqc_manifest.json
    - assets/quran/svg/douri_kfqc_manifest.json
    - assets/quran/riwayat/
    - assets/fonts/amiri_quran/OFL.txt
    - assets/adhkar/manifest.json
    - assets/adhkar/morning_evening.ar.json
    - assets/adhkar/curated.ar.json
    - assets/adhkar/hisn.ar.json
    - assets/adhkar/hisn_manifest.json
    - assets/adhan/voices.json
    - assets/reminders/weekly.json
    # The adhan's opening, the iqama phrase and the voices of the reminders
    # before the prayers as iOS notification sounds; iOS only.
    - path: assets/adhan/ios/adhan_regular.caf
      platforms: [ios]
    - path: assets/adhan/ios/adhan_fajr.caf
      platforms: [ios]
    - path: assets/adhan/ios/iqama_phrase.caf
      platforms: [ios]
    - path: assets/adhan/ios/prayer_near_fajr.caf
      platforms: [ios]
    - path: assets/adhan/ios/prayer_near_dhuhr.caf
      platforms: [ios]
    - path: assets/adhan/ios/prayer_near_jumuah.caf
      platforms: [ios]
    - path: assets/adhan/ios/prayer_near_asr.caf
      platforms: [ios]
    - path: assets/adhan/ios/prayer_near_maghrib.caf
      platforms: [ios]
    - path: assets/adhan/ios/prayer_near_isha.caf
      platforms: [ios]
    - assets/adhkar/LICENSE.seen-arabic.txt
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/amiri_quran/AmiriQuran-Regular.ttf
    - family: KfgqpcHafs
      fonts:
        - asset: assets/fonts/kfgqpc_hafs/uthmanic_hafs_v20.ttf
    - family: KfgqpcWarsh
      fonts:
        - asset: assets/fonts/kfgqpc_riwayat/warsh.10.ttf
    - family: KfgqpcQalon
      fonts:
        - asset: assets/fonts/kfgqpc_riwayat/qaloon.10.ttf
    - family: KfgqpcDouri
      fonts:
        - asset: assets/fonts/kfgqpc_riwayat/doori.9.ttf
    - family: KfgqpcShubah
      fonts:
        - asset: assets/fonts/kfgqpc_riwayat/shouba.8.ttf
