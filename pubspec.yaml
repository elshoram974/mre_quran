name: mre_quran
description: An Arabic-first Quran application.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  archive: ^4.3.0
  background_downloader: ^9.6.3
  crypto: ^3.0.7
  device_preview: ^3.0.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  go_router: ^18.0.2
  intl: ^0.20.3
  liquid_glass_widgets: ^1.9.0
  meta: ^1.19.0
  mre_fields: ^0.3.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.3
  sqlite3: ^3.7.0
  timezone: ^0.11.1
  wakelock_plus: ^1.5.2
  xml: ^7.1.0

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  go_router_builder: ^4.5.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/quran/quran-data.xml
    - assets/quran/quran-uthmani.txt
    - assets/quran/quran-simple-clean.txt
    - assets/fonts/amiri_quran/OFL.txt
    - assets/adhkar/manifest.json
    - assets/adhkar/morning_evening.ar.json
    - assets/adhkar/LICENSE.seen-arabic.txt
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/amiri_quran/AmiriQuran-Regular.ttf
